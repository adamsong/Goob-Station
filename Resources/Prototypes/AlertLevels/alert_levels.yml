- type: alertLevels
  id: stationAlerts
  defaultLevel: green
  levels:
    green:
      announcement: alert-level-green-announcement
      color: Green
      emergencyLightColor: LawnGreen
      shuttleTime: 600
    blue:
      announcement: alert-level-blue-announcement
      sound: AlertLevelBlue # monkestation edit - announcer variation
      color: DodgerBlue
      forceEnableEmergencyLights: true
      emergencyLightColor: DodgerBlue
      shuttleTime: 600
    violet:
      announcement: alert-level-violet-announcement
      sound: AlertLevelViolet # monkestation edit - announcer variation
      color: Violet
      emergencyLightColor: Violet
      forceEnableEmergencyLights: true
      shuttleTime: 600
    yellow:
      announcement: alert-level-yellow-announcement
      sound: AlertLevelYellow # monkestation edit - announcer variation
      color: Yellow
      emergencyLightColor: Goldenrod
      forceEnableEmergencyLights: true
      shuttleTime: 600
    red:
      announcement: alert-level-red-announcement
      sound: AlertLevelRed # monkestation edit - announcer variation
      color: Red
      emergencyLightColor: Red
      forceEnableEmergencyLights: true
      shuttleTime: 600 #No reduction in time as we don't have swiping for red alert like in /tg/. Shuttle times are intended to create friction, so having a way to brainlessly bypass that would be dumb.
    gamma:
      announcement: alert-level-gamma-announcement
      selectable: false
      sound: AlertLevelGamma # monkestation edit - announcer variation
      disableSelection: true
      color: PaleVioletRed
      emergencyLightColor: PaleVioletRed
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    delta:
      announcement: alert-level-delta-announcement
      selectable: false
      sound: AlertLevelDelta # monkestation edit - announcer variation
      disableSelection: true
      color: DarkRed
      emergencyLightColor: Orange
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    epsilon:
      announcement: alert-level-epsilon-announcement
      selectable: false
      sound: AlertLevelEpsilon # monkestation edit - announcer variation
      disableSelection: true
      color: DarkViolet
      emergencyLightColor: DarkViolet
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    omicron: # Goobstation
      announcement: alert-level-omicron-announcement
      selectable: false
      sound: AlertLevelOmicron # monkestation edit - announcer variation
      disableSelection: true
      color: Ivory
      emergencyLightColor: Ivory
      forceEnableEmergencyLights: true
      shuttleTime: 2400
    octarine: # DeltaV - Cosmic Cult
      announcement: alert-level-octarine-announcement
      selectable: false
      sound: AlertLevelOctarine # monkestation edit - announcer variation
      disableSelection: true
      color: CadetBlue
      emergencyLightColor: CadetBlue
      forceEnableEmergencyLights: true
      shuttleTime: 600
    honk: # Goobstation
      announcement: alert-level-honk-announcement
      selectable: false
      emagSelectable: true
      sound: AlertLevelHonk # monkestation edit - announcer variation
      color: Magenta
      emergencyLightColor: Magenta
      forceEnableEmergencyLights: true
      shuttleTime: 600
    amber: # Goobstation
      announcement: alert-level-amber-announcement
      sound: AlertLevelAmber # monkestation edit - announcer variation
      color: "#8A3324"
      emergencyLightColor: "#8A3324"
      forceEnableEmergencyLights: true
      shuttleTime: 600
